<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Hub AI System</title>
    <style>
        :root {
            --primary-color: #1a73e8;
            --secondary-color: #f8f9fa;
            --text-color: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 40px 20px;
            color: var(--text-color);
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        h1 { color: var(--primary-color); text-align: center; margin-bottom: 30px; }

        .upload-section {
            border: 2px dashed #b1cbf1;
            padding: 30px;
            border-radius: 10px;
            background-color: #fbfdff;
            margin-bottom: 30px;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
        }
        select, input[type="file"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }
        .hint { font-size: 0.8rem; color: #777; margin-top: 6px; }

        .btn {
            padding: 14px 30px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: 0.3s;
        }
        .btn:hover { background: #1557b0; }
        .btn:disabled { background: #9db8e8; cursor: not-allowed; }

        .btn-secondary {
            display: inline-block;
            margin-top: 10px;
            margin-right: 10px;
            padding: 8px 16px;
            background: white;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
        }

        .result-box {
            background: var(--secondary-color);
            padding: 25px;
            margin-top: 25px;
            border-radius: 10px;
            border-left: 6px solid var(--primary-color);
        }
        .result-box h2 {
            font-size: 1.2rem;
            color: #2c3e50;
            margin-top: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }
        .result-box h2:first-child { margin-top: 0; }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            background: #e8f0fe;
            color: var(--primary-color);
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin: 3px 4px 3px 0;
        }
        .sentiment-badge { background: #d4edda; color: #155724; }

        .error-box {
            background: #fce4e4;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
            border-left: 5px solid #d93025;
            color: #d93025;
        }

        #loadingOverlay { display: none; text-align: center; margin-top: 20px; }
        .spinner {
            border: 4px solid rgba(0,0,0,0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: var(--primary-color);
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #statusText { font-size: 0.9rem; color: #666; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Exam Hub - AI Processing Engine</h1>

        <form class="upload-section" id="uploadForm">
            {% csrf_token %}
            <h3>Upload Audio/Video Lecture</h3>

            <div class="form-group" style="text-align: center;">
                <input type="file" name="audio_file" id="audioFile"
                       accept=".mp3,.wav,.m4a,.mp4,.ogg,.flac,.webm" required>
                <p class="hint">Supported: mp3, wav, m4a, mp4, ogg, flac, webm — max 200 MB</p>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="language">Source Language:</label>
                    <select name="language" id="language">
                        <option value="">🤖 Auto-Detect Language</option>
                        <option value="si">🇱🇰 Sinhala</option>
                        <option value="en">🇺🇸 English</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="task">AI Action:</label>
                    <select name="task" id="task">
                        <option value="transcribe">📝 Transcribe (Keep Original Language)</option>
                        <option value="translate">🌐 Translate to English</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn" id="submitBtn">Process with AI Engine</button>

            <div id="loadingOverlay">
                <div class="spinner"></div>
                <p><strong>AI is analyzing your lecture...</strong><br>This can take a few minutes for longer files.</p>
                <p id="statusText"></p>
            </div>
        </form>

        <div id="resultContainer">
            {% if error %}
            <div class="error-box"><p><strong>Error:</strong> {{ error }}</p></div>
            {% endif %}
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const statusText = document.getElementById('statusText');
        const resultContainer = document.getElementById('resultContainer');
        const MAX_SIZE_BYTES = 200 * 1024 * 1024;

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str ?? '';
            return div.innerHTML;
        }

        function renderError(message) {
            resultContainer.innerHTML =
                `<div class="error-box"><p><strong>Error:</strong> ${escapeHtml(message)}</p></div>`;
        }

        function renderResult(result) {
            const tagsHtml = Array.isArray(result.seo_data?.seo_tags)
                ? result.seo_data.seo_tags.map(t => `<span class="badge">${escapeHtml(t)}</span>`).join(' ')
                : escapeHtml(result.seo_data?.seo_tags ?? '');

            resultContainer.innerHTML = `
                <div class="result-box">
                    <h2>1. AI Summary & Sentiment</h2>
                    <p><strong>Executive Summary:</strong> ${escapeHtml(result.summary)}</p>
                    <p><strong>Overall Tone:</strong> <span class="badge sentiment-badge">${escapeHtml(result.sentiment)}</span></p>

                    <h2>2. Full Transcript</h2>
                    <p style="white-space: pre-wrap; line-height: 1.6;">${escapeHtml(result.transcript)}</p>
                    <a class="btn-secondary" id="downloadTranscript">Download transcript (.txt)</a>

                    <h2>3. SEO & Social Media Data</h2>
                    <p><strong>YouTube Title:</strong> ${escapeHtml(result.seo_data?.youtube_title)}</p>
                    <p><strong>SEO Tags:</strong> ${tagsHtml}</p>
                    <p><strong>Facebook Post:</strong> ${escapeHtml(result.seo_data?.facebook_post)}</p>

                    <h2>4. AI Q&A Module (Auto-Generated)</h2>
                    <p><strong>Sample Question:</strong> What is the main topic discussed here?</p>
                    <p><strong>AI Answer:</strong> ${escapeHtml(result.qa_answer)}</p>
                </div>
            `;

            const link = document.getElementById('downloadTranscript');
            const blob = new Blob([result.transcript], { type: 'text/plain' });
            link.href = URL.createObjectURL(blob);
            link.download = 'transcript.txt';
        }

        function pollStatus(taskId) {
            fetch(`status/${taskId}/`)
                .then(r => r.json())
                .then(data => {
                    if (data.state === 'SUCCESS') {
                        loadingOverlay.style.display = 'none';
                        submitBtn.style.display = 'block';
                        submitBtn.disabled = false;
                        renderResult(data.result);
                    } else if (data.state === 'FAILURE') {
                        loadingOverlay.style.display = 'none';
                        submitBtn.style.display = 'block';
                        submitBtn.disabled = false;
                        renderError(data.error || 'Processing failed.');
                    } else {
                        statusText.textContent = data.state === 'RUNNING'
                            ? 'Transcribing and analyzing...'
                            : 'Queued — waiting for a worker...';
                        setTimeout(() => pollStatus(taskId), 3000);
                    }
                })
                .catch(() => {
                    statusText.textContent = 'Lost connection to the server, retrying...';
                    setTimeout(() => pollStatus(taskId), 5000);
                });
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            resultContainer.innerHTML = '';

            const fileInput = document.getElementById('audioFile');
            const file = fileInput.files[0];
            if (!file) return;
            if (file.size > MAX_SIZE_BYTES) {
                renderError('File is too large. Maximum size is 200 MB.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.style.display = 'none';
            loadingOverlay.style.display = 'block';
            statusText.textContent = 'Uploading...';

            const formData = new FormData(form);

            fetch('', {
                method: 'POST',
                body: formData,
                headers: { 'X-Requested-With': 'XMLHttpRequest' },
            })
                .then(async (r) => {
                    if (!r.ok) {
                        const data = await r.json().catch(() => ({}));
                        throw new Error(data.error || 'Upload failed.');
                    }
                    return r.json();
                })
                .then((data) => {
                    statusText.textContent = 'Queued — waiting for a worker...';
                    pollStatus(data.task_id);
                })
                .catch((err) => {
                    loadingOverlay.style.display = 'none';
                    submitBtn.style.display = 'block';
                    submitBtn.disabled = false;
                    renderError(err.message);
                });
        });
    </script>
</body>
</html>
