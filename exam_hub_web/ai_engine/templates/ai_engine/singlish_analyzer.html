<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exam Hub - Singlish AI Tutor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #2c3e50; color: white; margin: 0; padding: 40px; }
        .container { max-width: 750px; margin: auto; background: #34495e; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        h1 { color: #f1c40f; text-align: center; }
        p.subtitle { text-align: center; color: #bdc3c7; margin-bottom: 30px; }
        textarea { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 16px; background: #ecf0f1; margin-bottom: 20px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; background: #f1c40f; color: #2c3e50; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #d4ac0d; }
        .result-card { background: #ecf0f1; color: #2c3e50; padding: 20px; margin-top: 25px; border-radius: 8px; border-left: 6px solid #e74c3c; }
        .processing-tag { display: inline-block; background: #e74c3c; color: white; padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Singlish Tech Analyzer</h1>
        <p class="subtitle">Ask your IT/Tech questions in Singlish! The AI will translate and answer.</p>
        
        <form method="POST">
            {% csrf_token %}
            <textarea name="singlish_query" rows="4" required placeholder="Type here... (e.g., 'router eka wada karanne kohomada?')"></textarea>
            <button type="submit" class="btn">Analyze & Answer</button>
        </form>

        {% if result %}
        <div class="result-card">
            <span class="processing-tag">AI Translation (Pseudo-English)</span>
            <p style="font-style: italic; color: #7f8c8d;">"{{ result.mapped_english }}"</p>
            
            <hr style="border: 0; height: 1px; background: #bdc3c7; margin: 15px 0;">
            
            <span class="processing-tag" style="background: #27ae60;">AI Answer</span>
            <h3 style="margin-top: 10px;">{{ result.ai_answer }}</h3>
        </div>
        {% endif %}
        
        {% if error %}
        <div class="result-card" style="border-left-color: #c0392b;">
            <p><strong>Error:</strong> {{ error }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
